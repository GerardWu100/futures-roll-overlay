[project]
name = "futures-roll-overlay"
version = "0.1.0"
description = "Offline futures term-structure and realized-variance forecasting pipeline"
requires-python = ">=3.13"
dependencies = [
    "clickhouse-connect>=0.8.18",
    "matplotlib>=3.10.0",
    "numpy>=2.2.0",
    "pandas>=2.2.3",
    "pyarrow>=19.0.0",
    "python-dotenv>=1.1.0",
    "scipy>=1.15.0",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "nbconvert>=7.16.6",
    "pytest>=8.3.5",
    "ruff>=0.11.2",
]

[project.scripts]
futures-roll-research = "futures_roll_overlay.pipeline.run_research_pipeline:main"
futures-roll-refresh-raw = "futures_roll_overlay.data_access.refresh_clickhouse_raw:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/futures_roll_overlay"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]
